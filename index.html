<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090b12">

  <title>Ninja</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <!-- HEADER -->
    <header class="top-bar">

      <button class="profile-button" id="profileButton">
        <div class="avatar">🥷</div>

        <div class="profile-info">
          <span class="profile-name" id="playerName">Ninja</span>
          <span class="profile-level">Nivel <strong id="playerLevel">1</strong></span>
        </div>
      </button>

      <button class="menu-button" id="menuButton" aria-label="Abrir menú">
        ☰
      </button>

    </header>


    <!-- MENÚ -->
    <aside class="side-menu" id="sideMenu">

      <div class="menu-header">
        <span>MENÚ</span>

        <button id="closeMenu">×</button>
      </div>

      <nav>

        <button class="menu-item">
          <span>👤</span>
          <span>Perfil</span>
        </button>

        <button class="menu-item">
          <span>⚙️</span>
          <span>Ajustes</span>
        </button>

        <button class="menu-item">
          <span>🎁</span>
          <span>Recompensas</span>
        </button>

        <button class="menu-item">
          <span>👥</span>
          <span>Referidos</span>
        </button>

        <button class="menu-item">
          <span>🤝</span>
          <span>Socios</span>
        </button>

        <button class="menu-item">
          <span>🎯</span>
          <span>Misiones externas</span>
        </button>

        <button class="menu-item">
          <span>💰</span>
          <span>Wallet</span>
        </button>

      </nav>

      <div class="menu-event">

        <span class="event-label">PRÓXIMO EVENTO</span>

        <strong>👹 JEFE SUPREMO</strong>

        <span id="eventCountdown">Preparándose...</span>

      </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->
    <section class="battle-area">


      <!-- INFORMACIÓN DEL JEFE -->
      <div class="boss-info">

        <div class="boss-title-row">

          <div>
            <span class="boss-label">JEFE</span>
            <h1 id="bossName">REY DE LAS SOMBRAS</h1>
          </div>

          <span class="boss-level">
            NIVEL <strong id="bossLevel">5</strong>
          </span>

        </div>


        <!-- VIDA -->
        <div class="health-container">

          <div class="health-text">
            <span>❤️ VIDA</span>

            <span>
              <strong id="bossHealth">10000</strong>
              /
              <span id="bossMaxHealth">10000</span>
            </span>
          </div>

          <div class="health-bar">
            <div class="health-fill" id="bossHealthBar"></div>
          </div>

        </div>

      </div>


      <!-- ENEMIGO -->
      <div class="enemy-area">

        <div class="enemy-aura"></div>

        <div class="enemy" id="enemy">

          <div class="enemy-eyes">
            <span></span>
            <span></span>
          </div>

          <div class="enemy-face">
            👹
          </div>

        </div>

        <div class="enemy-name">
          REY DE LAS SOMBRAS
        </div>

        <div class="damage-container" id="damageContainer"></div>

      </div>


      <!-- ENERGÍA -->
      <div class="energy-section">

        <div class="energy-header">

          <span>⚡ ENERGÍA</span>

          <strong>
            <span id="energy">100</span>/100
          </strong>

        </div>

        <div class="energy-bar">
          <div class="energy-fill" id="energyBar"></div>
        </div>

        <div class="energy-recovery">
          Recuperación: <span id="recoveryTimer">00:00</span>
        </div>

      </div>


      <!-- ATAQUES -->
      <div class="attack-buttons">

        <!-- COMBO -->
        <button
          class="attack-button combo"
          id="comboButton"
          data-cost="4"
        >

          <span class="attack-icon">💥</span>

          <span class="attack-name">
            COMBO
          </span>

          <span class="attack-description">
            ×3 GOLPES
          </span>

          <span class="attack-cost">
            ⚡ 4
          </span>

        </button>


        <!-- ATAQUE -->
        <button
          class="attack-button normal"
          id="attackButton"
          data-cost="2"
        >

          <span class="attack-icon">⚔️</span>

          <span class="attack-name">
            ATAQUE
          </span>

          <span class="attack-description">
            DAÑO NORMAL
          </span>

          <span class="attack-cost">
            ⚡ 2
          </span>

        </button>


        <!-- CRÍTICO -->
        <button
          class="attack-button critical"
          id="criticalButton"
          data-cost="8"
        >

          <span class="attack-icon">🔥</span>

          <span class="attack-name">
            CRÍTICO
          </span>

          <span class="attack-description">
            DAÑO MASIVO
          </span>

          <span class="attack-cost">
            ⚡ 8
          </span>

        </button>

      </div>


      <!-- MONEDAS / WALLET -->
      <div class="bottom-bar">

        <div class="coins">

          <span class="coin-icon">🪙</span>

          <div>
            <span class="coins-label">MONEDAS</span>
            <strong id="coins">1250</strong>
          </div>

        </div>

        <button class="wallet-button">
          💰 WALLET
        </button>

      </div>

    </section>

  </main>


  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>


  <script src="script.js"></script>

</body>
</html>
