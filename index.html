<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Ninja Battle</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <main class="game">

        <!-- =====================================
             BARRA SUPERIOR
        ====================================== -->

        <header class="top-bar">

            <button id="profileButton" class="profile">

                <div class="avatar">
                    <span id="avatarLetter">N</span>
                </div>

                <div class="profile-info">
                    <strong id="playerName">Ninja</strong>
                    <span id="playerLevel">Nivel 1</span>
                </div>

            </button>


            <div class="top-actions">

                <div class="coins">
                    <span>🪙</span>
                    <strong id="coinsText">1,250</strong>
                </div>

                <button
                    id="walletButton"
                    class="top-action wallet-action"
                >
                    💰
                    <span>Wallet</span>
                </button>

                <button
                    id="shopButton"
                    class="top-action shop-action"
                >
                    🛒
                    <span>Tienda</span>
                </button>

                <button
                    id="menuButton"
                    class="menu-button"
                    aria-label="Abrir menú"
                >
                    ☰
                </button>

            </div>

        </header>


        <!-- =====================================
             ZONA DE COMBATE
        ====================================== -->

        <section class="battle-area">

            <div class="boss-info">

                <div class="enemy-name">

                    <span id="enemyType">DEMONIO</span>

                    <h1 id="enemyName">
                        Akuma Rojo
                    </h1>

                </div>

                <div class="health-text">

                    <span>❤️</span>

                    <span id="enemyHealthText">
                        5,000 / 5,000
                    </span>

                </div>

                <div class="health-bar">

                    <div
                        id="enemyHealthBar"
                        class="health-fill"
                    ></div>

                </div>

            </div>


            <div
                id="enemy"
                class="enemy"
            >

                <div class="enemy-aura"></div>

                <div class="enemy-character">

                    <div class="enemy-head">

                        <div class="horn horn-left"></div>

                        <div class="horn horn-right"></div>

                        <div class="enemy-face">

                            <div class="eye eye-left"></div>

                            <div class="eye eye-right"></div>

                        </div>

                    </div>

                    <div class="enemy-body">

                        <div
                            class="armor armor-left"
                        ></div>

                        <div
                            class="armor armor-right"
                        ></div>

                        <div class="chest-core"></div>

                    </div>

                    <div class="enemy-cloak"></div>

                </div>

                <div
                    id="damageNumber"
                    class="damage-number"
                ></div>

            </div>

        </section>
        <!-- =====================================
             ENERGÍA
        ====================================== -->

        <section class="energy-section">

            <div class="energy-header">

                <span>
                    ⚡ ENERGÍA
                </span>

                <strong id="energyText">
                    100 / 100
                </strong>

            </div>

            <div class="energy-bar">

                <div
                    id="energyBar"
                    class="energy-fill"
                ></div>

            </div>

        </section>


        <!-- =====================================
             ATAQUES
        ====================================== -->

        <section class="attack-section">

            <button
                id="comboButton"
                class="attack-button combo"
            >

                <span class="attack-icon">
                    🔥
                </span>

                <strong>
                    COMBO
                </strong>

                <small>
                    3 GOLPES
                    <br>
                    -4 ⚡
                </small>

            </button>


            <button
                id="attackButton"
                class="attack-button normal"
            >

                <span class="attack-icon">
                    ⚔️
                </span>

                <strong>
                    ATAQUE
                </strong>

                <small>
                    NORMAL
                    <br>
                    -2 ⚡
                </small>

            </button>


            <button
                id="criticalButton"
                class="attack-button critical"
            >

                <span class="attack-icon">
                    💥
                </span>

                <strong>
                    CRÍTICO
                </strong>

                <small>
                    PODER
                    <br>
                    -8 ⚡
                </small>

            </button>

        </section>


        <!-- =====================================
             MENÚ LATERAL
        ====================================== -->

        <aside
            id="sideMenu"
            class="side-menu"
        >

            <div class="menu-header">

                <h2>
                    Ninja Battle
                </h2>

                <button
                    id="closeMenu"
                    class="close-menu"
                >
                    ×
                </button>

            </div>

            <div class="menu-player">

                <div class="menu-avatar">

                    <span id="menuAvatarLetter">
                        N
                    </span>

                </div>

                <div>

                    <strong id="menuPlayerName">
                        Ninja
                    </strong>

                    <span id="menuPlayerLevel">
                        Nivel 1
                    </span>

                </div>

            </div>
            <nav class="menu-options">

                <button id="profileMenuOption">
                    👤
                    <span>Perfil</span>
                </button>

                <button id="settingsMenuOption">
                    ⚙️
                    <span>Ajustes</span>
                </button>

                <button id="rewardsMenuOption">
                    🎁
                    <span>Recompensas</span>
                </button>

                <button id="adsMenuOption">
                    📺
                    <span>Ver anuncios</span>
                </button>

                <button id="referralsMenuOption">
                    👥
                    <span>Referidos</span>
                </button>

                <button id="partnersMenuOption">
                    🤝
                    <span>Socios</span>
                </button>

                <button id="missionsMenuOption">
                    🎯
                    <span>Misiones externas</span>
                </button>

                <button id="walletMenuOption">
                    💰
                    <span>Wallet TON</span>
                </button>

            </nav>

        </aside>


        <div
            id="menuOverlay"
            class="menu-overlay"
        ></div>

    </main>

    <script src="script.js?v=2"></script>

</body>
</html>
