<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Ninja Battle</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- PERFIL -->
        <header class="top-bar">

            <button id="profileButton" class="profile">
                <div class="avatar">
                    <span id="avatarLetter">N</span>
                </div>

                <div class="profile-info">
                    <strong id="playerName">Ninja</strong>
                    <span id="playerLevel">Nivel 1</span>
                </div>
            </button>

            <!-- MENÚ -->
            <button id="menuButton" class="menu-button" aria-label="Abrir menú">
                ☰
            </button>

        </header>


        <!-- ZONA DEL ENEMIGO -->
        <section class="battle-area">

            <div class="boss-info">

                <div class="enemy-name">
                    <span id="enemyType">JEFE</span>
                    <h1 id="enemyName">Rey de las Sombras</h1>
                </div>

                <div class="health-text">
                    <span>❤️</span>
                    <span id="enemyHealthText">10,000 / 10,000</span>
                </div>

                <div class="health-bar">
                    <div id="enemyHealthBar" class="health-fill"></div>
                </div>

            </div>


            <!-- ENEMIGO -->
            <div id="enemy" class="enemy">

                <div class="enemy-aura"></div>

                <div class="enemy-character">

                    <div class="enemy-head">
                        <div class="horn horn-left"></div>
                        <div class="horn horn-right"></div>

                        <div class="enemy-face">
                            <div class="eye eye-left"></div>
                            <div class="eye eye-right"></div>
                        </div>
                    </div>

                    <div class="enemy-body">

                        <div class="armor armor-left"></div>
                        <div class="armor armor-right"></div>

                        <div class="chest-core"></div>

                    </div>

                    <div class="enemy-cloak"></div>

                </div>

                <div id="damageNumber" class="damage-number"></div>

            </div>

        </section>


        <!-- ENERGÍA -->
        <section class="energy-section">

            <div class="energy-header">
                <span>⚡ ENERGÍA</span>
                <strong id="energyText">100 / 100</strong>
            </div>

            <div class="energy-bar">
                <div id="energyBar" class="energy-fill"></div>
            </div>

        </section>


        <!-- ATAQUES -->
        <section class="attack-section">

            <button id="comboButton" class="attack-button combo">

                <span class="attack-icon">🔥</span>

                <strong>COMBO</strong>

                <small>
                    3 GOLPES
                    <br>
                    -4 ⚡
                </small>

            </button>


            <button id="attackButton" class="attack-button normal">

                <span class="attack-icon">⚔️</span>

                <strong>ATAQUE</strong>

                <small>
                    NORMAL
                    <br>
                    -2 ⚡
                </small>

            </button>


            <button id="criticalButton" class="attack-button critical">

                <span class="attack-icon">💥</span>

                <strong>CRÍTICO</strong>

                <small>
                    DAÑO ALTO
                    <br>
                    -8 ⚡
                </small>

            </button>

        </section>


        <!-- MONEDAS / WALLET -->
        <section class="bottom-bar">

            <div class="coins">
                <span>🪙</span>
                <strong id="coinsText">1,250</strong>
            </div>

            <button id="walletButton" class="wallet-button">
                💰 Wallet
            </button>

        </section>

    </main>


    <!-- MENÚ LATERAL -->
    <aside id="sideMenu" class="side-menu">

        <div class="menu-header">

            <h2>Ninja Battle</h2>

            <button id="closeMenu" class="close-menu">
                ×
            </button>

        </div>


        <div class="menu-player">

            <div class="menu-avatar">
                <span id="menuAvatarLetter">N</span>
            </div>

            <div>
                <strong id="menuPlayerName">Ninja</strong>
                <span id="menuPlayerLevel">Nivel 1</span>
            </div>

        </div>


        <nav class="menu-options">

            <button>
                👤
                <span>Perfil</span>
            </button>

            <button>
                ⚙️
                <span>Ajustes</span>
            </button>

            <button>
                🎁
                <span>Recompensas</span>
            </button>

            <button>
                📺
                <span>Ver anuncios</span>
            </button>

            <button>
                👥
                <span>Referidos</span>
            </button>

            <button>
                🤝
                <span>Socios</span>
            </button>

            <button>
                🎯
                <span>Misiones externas</span>
            </button>

            <button>
                💰
                <span>Wallet TON</span>
            </button>

        </nav>

    </aside>


    <div id="menuOverlay" class="menu-overlay"></div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
